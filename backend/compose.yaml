services:
  nestjs:
    image: node:lts
    env_file:
      - .env
    ports:
      - "4000:3000"
    volumes:
      - ./:/home/app:cached
    working_dir: /home/app
    tty: true
    depends_on:
      - db
    command: sleep infinity
    networks:
      - network
      
  db:
    image: postgres
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
    - network

volumes:
  pgdata:

networks:
  network: